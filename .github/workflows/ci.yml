name: CI Test & Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-web:
    name: Backend & Web Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck / Lint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Web Production Assets
        run: npm run build

  flutter-app:
    name: Flutter Mobile Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd travelway_app
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd travelway_app
          flutter analyze

      - name: Run Flutter Widget Tests
        run: |
          cd travelway_app
          flutter test
